<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header class = "header">
        <nav class="left-menu">
            <a href="#">MODELS</a>
            <a href="#">CULTURE</a>
            <a href="#">COLLABORATIONS</a>
            <a href="#">YOUR BENTLEY</a>
            <a href="#">ABOUT BENTLEY</a>
        </nav>
        <div class="logo">
            <img src="logo.png" alt="Bentley Logo" width="150" height="70" />
        </div>
        <nav class="right-menu">
            <button class ="RTDbtn">REQUEST TEST DRIVE</button>
            <button class="header-buttons">CONFIGURATOR</button>
            <button class="header-buttons">LOCATE DEALER</button>
        </nav>
        <div class="header-mobile">
            <nav>
                <a href="#"  class="models">MODELS</a>
            </nav>
                <img src="logo.png" alt="Bentley Logo" width="150" height="70" class = "logo-mobile" />
                <button id = "menu-btn" class="hamburger-menu">&#9776;</button>    
        </div>
        
    </header>

    <div class = "main-menu" id = "main-menu">
        <button id = "close-btn" class="close-menu">&times;</button>
        <nav class = "main-menu-links">
            <a href="#">CULTURE</a>
            <a href="#">COLLABORATIONS</a>
            <a href="#">YOUR BENTLEY</a>
            <a href="#">ABOUT BENTLEY</a>
            <hr />
            <a href="#">CONFIGURATOR</a>
            <a href="#">LOCATE DEALER</a>
        </nav>
    </div>

    <main class="hero-section">
        <br />
        <p>Coming Soon</p>
        <br />
        <h2>The Bentley Torcal</h2>
    </main>

    <section class="action-section">
        <div class = "countdown">
            <div class = "timer">
                <h2 id = "days">03</h2>
                <p>days</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "hours">12</h2>
                <p>hours</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "minutes">30</h2>
                <p>minutes</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "seconds">45</h2>
                <p>seconds</p>
            </div>
        </div>
        <div class = "action-buttons">
            <button class = "learn-more">LEARN MORE</button>
            <button class = "keep-informed">KEEP ME INFORMED</button>
    </section>
<script src="script.js"></script>
</body>
</html>
