<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="left-menu">
            <a href="#">MODELS</a>
            <a href="#">CULTURE</a>
            <a href="#">COLLABORATIONS</a>
            <a href="#">YOUR BENTLEY</a>
            <a href="#">ABOUT BENTLEY</a>
        </nav>
        <div class="logo">
            <img src="logo.png" alt="Bentley Logo" width="150" height="70" />
        </div>
        <nav class="right-menu">
            <button>REQUEST TEST DRIVE</button>
            <a href="#">CONFIGURATOR</a>
            <a href="#">LOCATE DEALER</a>
        </nav>
    </header>

    <main class="hero-section">
        <br />
        <p>Coming Soon</p>
        <br />
        <p style="font-size: 75px;">The Bentley Torcal</p>
    </main>

    <section class="action-section">
        <div class = "countdown">
            <div class = "timer">
                <h2 id = "days">03</h2>
                <p>days</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "hours">12</h2>
                <p>hours</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "minutes">30</h2>
                <p>minutes</p>
            </div>
            <span style="font-size: 48px">:</span>
            <div class = "timer">
                <h2 id = "seconds">45</h2>
                <p>seconds</p>
            </div>
        </div>
        <div class = "action-buttons">
            <button class = "learn-more">LEARN MORE</button>
            <button class = "keep-informed">KEEP ME INFORMED</button>
    </section>
<script src="script.js"></script>
</body>
</html>
